<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080a0b">
    <meta name="description" content="JARVIS STUDIO — NOTE">
    <title>NOTE | JARVIS STUDIO</title>
    <style>
      :root { color-scheme: dark; --accent: #a8ffe0; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        background: #080a0b;
        color: #f1f5f3;
        font-family: Arial, "Helvetica Neue", sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 70% 45%, #a8ffe009, transparent 55%);
      }
      .page { position: relative; min-height: 100svh; height: 100svh; display: flex; flex-direction: column; padding: 0 7vw; }
      header, footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
      header { min-height: clamp(56px, 10svh, 100px); flex-shrink: 0; border-bottom: 1px solid #ffffff14; }
      .brand { font-size: 12px; font-weight: 700; letter-spacing: .2em; }
      .status { display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: .16em; color: #a6b4ae; }
      .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px #a8ffe080; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(16px, 3svh, 40px) 0; }
      .eyebrow { margin: 0 0 clamp(12px, 3svh, 30px); color: var(--accent); font-size: 11px; letter-spacing: .28em; }
      h1 { margin: 0; font-size: clamp(54px, min(10.5vw, 18svh), 160px); font-weight: 500; line-height: .95; letter-spacing: -.065em; }
      h1 span { display: block; color: #87958f; }
      .description { margin: clamp(16px, 3svh, 36px) 0 0; color: #a6b4ae; font-size: 14px; letter-spacing: .12em; line-height: 1.8; }
      .line { width: 56px; height: 1px; flex-shrink: 0; background: var(--accent); margin-top: clamp(16px, 3svh, 44px); box-shadow: 0 0 14px #a8ffe050; }
      .menu { display: grid; flex-shrink: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-bottom: clamp(16px, 3svh, 32px); }
      .menu a {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        text-decoration: none;
        min-height: clamp(48px, 7svh, 64px);
        padding: 12px;
        border: 1px solid #a8ffe026;
        border-radius: 2px;
        background: #a8ffe004;
        color: #c2d5cc;
        font: inherit;
        font-size: 11px;
        letter-spacing: .12em;
        line-height: 1.6;
        opacity: 1;
        -webkit-text-fill-color: #c2d5cc;
      }
      @media (max-width: 700px) {
        .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 360px) {
        .menu a:nth-child(-n+2) { min-height: max(clamp(48px, 7svh, 64px), calc(2 * 1.6 * 11px + 26px)); }
      }
      footer { min-height: clamp(40px, 8svh, 80px); flex-shrink: 0; border-top: 1px solid #ffffff14; font-size: 10px; letter-spacing: .12em; color: #788780; }
      @media (max-width: 480px) {
        .page { padding: 0 7vw; }
        .status { font-size: 8px; letter-spacing: .08em; }
        footer { font-size: 8px; letter-spacing: .05em; }
      }
      @media (max-height: 500px) {
        header { min-height: 40px; }
        main { padding: 4px 0; }
        .eyebrow { margin-bottom: 4px; }
        h1 { font-size: clamp(36px, min(10.5vw, 12svh), 60px); }
        .description { margin-top: 4px; }
        .line { margin-top: 4px; }
        .menu { gap: 8px; padding-bottom: 12px; }
        .menu a { min-height: 44px; padding: 8px 12px; }
        footer { min-height: 28px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand">JS / JARVIS STUDIO</div>
        <div class="status">SYSTEM ONLINE</div>
      </header>
      <main>
        <p class="eyebrow">CREATE THE NEXT.</p>
        <h1>NOTE</h1>
        <p class="description">ノートのページです。コンテンツは準備中です。</p>
        <div class="line" aria-hidden="true"></div>
      </main>
      <nav class="menu" aria-label="メインメニュー">
        <a href="line-stamps.html">LINE STAMPS</a>
        <a href="jarvis-works.html">JARVIS WORKS</a>
        <a href="index.html">HOME</a>
        <a href="projects.html">PROJECTS</a>
      </nav>
      <footer>
        <span>© JARVIS STUDIO</span>
        <span>DESIGNED FOR WHAT’S NEXT</span>
      </footer>
    </div>
  </body>
</html>
